name: PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  issues: read

jobs:
  approved-issue:
    name: PR Policy (Approved Issue)
    runs-on: ubuntu-24.04
    steps:
      - name: Verify maintainer authorship or linked approved open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MAINTAINER: alxsjk
          REQUIRED_LABEL: approved
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from collections.abc import Callable
          from typing import Any


          def extract_issue_numbers(body: str, repo: str) -> list[int]:
              cleaned = re.sub(r"<!--.*?-->", " ", body or "", flags=re.S)
              pattern = re.compile(
                  rf"https?://github\.com/{re.escape(repo)}/issues/(?P<url>\d+)\b"
                  r"|(?:^|[\s(\[/:])#(?P<short>\d+)\b"
              )
              numbers: list[int] = []
              seen: set[int] = set()
              for match in pattern.finditer(cleaned):
                  raw = match.group("url") or match.group("short")
                  if not raw:
                      continue
                  num = int(raw)
                  if num > 0 and num not in seen:
                      seen.add(num)
                      numbers.append(num)
                      if len(numbers) >= 10:
                          break
              return numbers


          def evaluate_pr_policy(
              author: str,
              body: str,
              repo: str,
              fetch_issue: Callable[[int], tuple[int, dict[str, Any] | None]],
              *,
              maintainer: str = "alxsjk",
              required_label: str = "approved",
          ) -> tuple[bool, str]:
              if author.strip().lower() == maintainer.strip().lower():
                  return True, f"Maintainer PR (@{maintainer}) - policy check passed."

              numbers = extract_issue_numbers(body, repo)
              if not numbers:
                  return (
                      False,
                      "No linked issue found in the PR description. "
                      f"Reference an open issue approved by @{maintainer} "
                      f"(carrying the '{required_label}' label), for example 'Closes #123'.",
                  )

              reasons: list[str] = []
              for num in numbers:
                  status, data = fetch_issue(num)
                  if status != 200 or not isinstance(data, dict):
                      reasons.append(f"#{num} not found (HTTP {status})")
                      continue
                  if "pull_request" in data:
                      reasons.append(f"#{num} is a pull request, not an issue")
                      continue
                  state = str(data.get("state") or "")
                  if state != "open":
                      reasons.append(f"#{num} is {state or 'closed'}")
                      continue
                  labels = [
                      str(lbl.get("name") or "").lower()
                      for lbl in (data.get("labels") or [])
                      if isinstance(lbl, dict)
                  ]
                  if required_label.lower() not in labels:
                      reasons.append(f"#{num} is missing maintainer label '{required_label}'")
                      continue
                  return True, f"Approved open issue #{num} verified."

              return False, "No referenced issue qualifies: " + "; ".join(reasons) + "."


          def fetch_issue_via_api(repo: str, token: str, number: int) -> tuple[int, dict[str, Any] | None]:
              url = f"https://api.github.com/repos/{repo}/issues/{number}"
              headers = {
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "fwt-pr-policy",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  return exc.code, None


          def main() -> int:
              repo = os.environ.get("REPO", "")
              token = os.environ.get("GH_TOKEN", "")
              author = os.environ.get("PR_AUTHOR", "")
              body = os.environ.get("PR_BODY", "")
              maintainer = os.environ.get("MAINTAINER", "alxsjk")
              required_label = os.environ.get("REQUIRED_LABEL", "approved")

              ok, message = evaluate_pr_policy(
                  author,
                  body,
                  repo,
                  lambda num: fetch_issue_via_api(repo, token, num),
                  maintainer=maintainer,
                  required_label=required_label,
              )
              if not ok:
                  print(f"::error::{message}")
                  return 1
              print(message)
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
