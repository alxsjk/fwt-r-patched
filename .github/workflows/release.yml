name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify lint, types, compile, and unit tests
        run: |
          python -m ruff check .
          python -m mypy core gui fwt_patcher.py tools tests
          python -m compileall -q core gui tools tests fwt_patcher.py
          python -m pytest -q -m "not integration" -rs
      - name: Verify tag matches APP_VERSION
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from core.version import APP_VERSION

          tag = os.environ["TAG_NAME"]
          expected = f"v{APP_VERSION}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match core.version.APP_VERSION {expected!r}")
          PY
      - name: Build clean distribution suite archive
        run: python tools/create_distribution_zip.py
      - name: Extract changelog notes for current version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.version import APP_VERSION

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          header = f"## [{APP_VERSION}]"
          capturing = False
          lines = []
          for line in changelog:
              if line.startswith("## ["):
                  if capturing:
                      break
                  if line.startswith(header):
                      capturing = True
                      continue
              elif capturing:
                  lines.append(line)
          notes = "\n".join(lines).strip() or f"FWT Reborn Patch v{APP_VERSION}"
          Path("output/RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Create or update GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from core.version import APP_VERSION

          tag = os.environ["TAG_NAME"]
          archive = Path(f"output/FWT-Reborn-Patcher-Suite-{APP_VERSION}.zip")
          if not archive.is_file():
              raise SystemExit(f"Expected archive not found: {archive}")
          notes = Path("output/RELEASE_NOTES.md")
          exists = subprocess.run(
              ["gh", "release", "view", tag],
              check=False,
              capture_output=True,
          ).returncode == 0
          if exists:
              subprocess.run(
                  ["gh", "release", "upload", tag, str(archive), "--clobber"],
                  check=True,
              )
          else:
              subprocess.run(
                  [
                      "gh",
                      "release",
                      "create",
                      tag,
                      str(archive),
                      "--title",
                      f"FWT Reborn Patch {tag}",
                      "--notes-file",
                      str(notes),
                  ],
                  check=True,
              )
          PY
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fwt-reborn-patcher-suite
          path: output/FWT-Reborn-Patcher-Suite-*.zip
          if-no-files-found: error
